version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - run:
          name: Install system dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev gettext autopoint libltdl-dev
      - run:
          name: Install Buildozer
          command: |
            pip install buildozer cython==0.29.33
      - run:
          name: Build APK
          command: |
            rm -rf .buildozer
            rm -rf ~/.buildozer
            buildozer -v android debug
          no_output_timeout: 60m
      - store_artifacts:
          path: bin
          destination: apk

workflows:
  build-apk:
    jobs:
      - build
