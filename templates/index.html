<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureVault - Native Password-Protected Files</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 md:p-8">

        <!-- Header -->
        <div class="mb-6 text-center">
            <h1 class="text-2xl font-bold tracking-tight">SecureVault</h1>
            <p class="text-sm text-slate-400 mt-1">AES-256 password-protected file sharing.</p>
        </div>

        <!-- Form -->
        <form id="encrypt-form" onsubmit="handleEncrypt(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Select File to Lock</label>
                <input type="file" id="file-input" required class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-slate-800 file:text-slate-200 hover:file:bg-slate-700 cursor-pointer border border-slate-800 rounded-xl p-2 bg-slate-950"/>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Compression Mode</label>
                <select id="compression-input" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 transition text-slate-200">
                    <option value="deflate">Compress File (Recommended for documents/code - smaller size)</option>
                    <option value="none">No Compression (Fastest for large videos/photos)</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Receiver Password</label>
                <input type="password" id="password-input" placeholder="Enter unlock password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 transition"/>
            </div>

            <button type="submit" id="submit-btn" class="w-full py-3 px-4 rounded-xl font-semibold bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg transition duration-200">
                Generate Protected File
            </button>
        </form>

        <!-- Status Box (processing / errors only) -->
        <div id="status-box" class="mt-4 hidden p-3 rounded-xl text-xs text-center"></div>

        <!-- Result Card (appears on success) -->
        <div id="result-card" class="mt-4 hidden">
            <div class="rounded-xl border border-emerald-800 bg-emerald-950/40 p-4 space-y-3">

                <!-- Success header -->
                <div class="text-center">
                    <p class="text-sm font-semibold text-emerald-300">✓ File is ready</p>
                    <p class="text-xs text-slate-400 mt-1 break-all" id="result-filename"></p>
                    <p class="text-[11px] text-slate-500" id="result-size"></p>
                </div>

                <!-- Password reminder -->
                <div class="bg-slate-950 border border-slate-800 rounded-lg p-3">
                    <div class="flex items-center gap-2">
                        <div class="min-w-0 flex-1">
                            <p class="text-[10px] uppercase tracking-wider text-slate-500">Password to send</p>
                            <p class="text-sm font-mono text-slate-200 truncate" id="result-password"></p>
                        </div>
                        <button type="button" id="copy-btn" onclick="copyPassword()" class="shrink-0 px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 transition">
                            Copy
                        </button>
                    </div>
                </div>

                <!-- Actions -->
                <div class="grid gap-2">
                    <button type="button" id="share-btn" onclick="shareGeneratedFile()" class="hidden w-full py-2.5 px-4 rounded-lg font-semibold bg-blue-600 hover:bg-blue-500 text-white text-sm transition">
                        Share File
                    </button>
                    <button type="button" onclick="downloadAgain()" class="w-full py-2.5 px-4 rounded-lg font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm transition">
                        Download Again
                    </button>
                </div>

                <!-- Share hint / error -->
                <p id="share-hint" class="text-[11px] text-slate-500 text-center leading-relaxed"></p>
            </div>
        </div>

        <!-- Info Note -->
        <div class="mt-6 text-xs text-slate-500 text-center border-t border-slate-800/60 pt-4">
            <strong>Note for Receiver:</strong> When they receive the downloaded <code>.secure.zip</code> file, they just open it on their device, and they will automatically be prompted to type the password.
        </div>

    </div>

    <script>
        // Per-file share size hint (most mobile browsers cap around 15–25 MB)
        const SOFT_SHARE_LIMIT = 15 * 1024 * 1024; // 15 MB

        // Retained result so "Download Again" and "Share" both work reliably
        // { blobUrl, file, filename, size, password }
        let result = null;
        let shareAvailable = false;

        // Release blob URL when the page unloads to free memory
        window.addEventListener('beforeunload', () => {
            if (result?.blobUrl) URL.revokeObjectURL(result.blobUrl);
        });

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function setStatus(type, message) {
            const statusBox = document.getElementById('status-box');
            const base = 'mt-4 p-3 rounded-xl text-xs text-center block ';
            if (type === 'info') {
                statusBox.className = base + 'bg-slate-800 text-slate-300';
            } else if (type === 'error') {
                statusBox.className = base + 'bg-rose-950 text-rose-300 border border-rose-800';
            }
            statusBox.innerText = message;
        }

        function clearStatus() {
            const statusBox = document.getElementById('status-box');
            statusBox.className = 'mt-4 p-3 rounded-xl text-xs text-center hidden';
            statusBox.innerText = '';
        }

        function setHint(message, isError = false) {
            const hint = document.getElementById('share-hint');
            hint.innerText = message || '';
            hint.className = isError
                ? 'text-[11px] text-rose-400 text-center leading-relaxed'
                : 'text-[11px] text-slate-500 text-center leading-relaxed';
        }

        async function handleEncrypt(event) {
            event.preventDefault();

            const form = document.getElementById('encrypt-form');
            const fileInput = document.getElementById('file-input');
            const passwordInput = document.getElementById('password-input');
            const compressionInput = document.getElementById('compression-input');
            const submitBtn = document.getElementById('submit-btn');
            const resultCard = document.getElementById('result-card');

            if (!fileInput.files[0]) return;

            const originalFileName = fileInput.files[0].name;
            const secureFileName = originalFileName + '.secure.zip';
            const password = passwordInput.value;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('password', password);
            formData.append('compression', compressionInput.value);

            // Reset any previous result
            if (result?.blobUrl) URL.revokeObjectURL(result.blobUrl);
            result = null;
            shareAvailable = false;

            submitBtn.disabled = true;
            resultCard.classList.add('hidden');
            clearStatus();
            setStatus('info', 'Processing and encrypting archive...');

            try {
                const response = await fetch('/api/create-secure-zip', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    let msg = 'Encryption failed';
                    try {
                        const err = await response.json();
                        msg = err.error || msg;
                    } catch { /* non-JSON error body */ }
                    throw new Error(msg);
                }

                const blob = await response.blob();

                // Retain a live blob URL for re-download (do NOT revoke now)
                const blobUrl = URL.createObjectURL(blob);

                // Trigger the initial auto-download
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = secureFileName;
                document.body.appendChild(a);
                a.click();
                a.remove();

                // Build the File object for Web Share (canShare check is guarded)
                let fileObj = null;
                let canShareThis = false;
                try {
                    fileObj = new File([blob], secureFileName, { type: 'application/zip' });
                    canShareThis = !!(navigator.canShare && navigator.canShare({ files: [fileObj] }));
                } catch {
                    canShareThis = false;
                }

                // Persist result so both buttons work after this function returns
                result = {
                    blobUrl,
                    file: fileObj,
                    filename: secureFileName,
                    size: blob.size,
                    password
                };
                shareAvailable = canShareThis;

                // Populate the success card
                document.getElementById('result-filename').innerText = secureFileName;
                document.getElementById('result-size').innerText = formatSize(blob.size);
                document.getElementById('result-password').innerText = password;

                const shareBtn = document.getElementById('share-btn');
                if (canShareThis) {
                    shareBtn.classList.remove('hidden');
                    if (blob.size > SOFT_SHARE_LIMIT) {
                        setHint('File is large — direct share may fail on some devices. Use "Download Again" as a fallback.');
                    } else {
                        setHint('Share sends the file via your device\'s share menu. The password is not included — send it separately.');
                    }
                } else {
                    shareBtn.classList.add('hidden');
                    setHint('Direct file sharing isn\'t supported on this browser. Use "Download Again" and share manually.');
                }

                // Show card, hide processing status
                clearStatus();
                resultCard.classList.remove('hidden');

                // Reset the form now that we have everything we need saved
                form.reset();
            } catch (err) {
                setStatus('error', err.message || 'Something went wrong.');
            } finally {
                submitBtn.disabled = false;
            }
        }

        async function shareGeneratedFile() {
            if (!result || !result.file) return;

            const shareBtn = document.getElementById('share-btn');
            const originalLabel = 'Share File';

            try {
                await navigator.share({
                    files: [result.file],
                    title: result.filename,
                    text: 'Protected file attached. The password is shared separately.'
                });

                // Success feedback
                shareBtn.textContent = '✓ Shared';
                shareBtn.classList.remove('bg-blue-600', 'hover:bg-blue-500');
                shareBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-500');
                setTimeout(() => {
                    shareBtn.textContent = originalLabel;
                    shareBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-500');
                    shareBtn.classList.add('bg-blue-600', 'hover:bg-blue-500');
                }, 2000);
            } catch (err) {
                // User cancelled — do nothing
                if (err && err.name === 'AbortError') return;

                let msg = 'Could not open the share dialog.';
                if (err && err.name === 'NotAllowedError') {
                    msg = 'Share permission was denied.';
                } else if (err && err.name === 'DataError') {
                    msg = 'This file is too large to share directly.';
                } else if (err && err.name === 'NotSupportedError') {
                    msg = 'File sharing is not supported on this browser.';
                } else if (err && err.message) {
                    msg = err.message;
                }
                setHint(msg + ' Use "Download Again" and share the file manually.', true);
            }
        }

        function downloadAgain() {
            if (!result) return;
            const a = document.createElement('a');
            a.href = result.blobUrl;
            a.download = result.filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        async function copyPassword() {
            if (!result) return;
            const btn = document.getElementById('copy-btn');
            const original = 'Copy';
            try {
                await navigator.clipboard.writeText(result.password);
                btn.textContent = '✓ Copied';
                btn.classList.remove('bg-slate-800', 'hover:bg-slate-700');
                btn.classList.add('bg-emerald-700', 'hover:bg-emerald-600');
            } catch {
                // Fallback for browsers without clipboard API
                const temp = document.createElement('textarea');
                temp.value = result.password;
                document.body.appendChild(temp);
                temp.select();
                try { document.execCommand('copy'); btn.textContent = '✓ Copied'; }
                catch { btn.textContent = 'Failed'; }
                temp.remove();
            }
            setTimeout(() => {
                btn.textContent = original;
                btn.classList.remove('bg-emerald-700', 'hover:bg-emerald-600');
                btn.classList.add('bg-slate-800', 'hover:bg-slate-700');
            }, 2000);
        }
    </script>
</body>
</html>
